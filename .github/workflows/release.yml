# Release automation.
#
# Every push to main runs release-please, which reads the Conventional Commit
# messages since the last release and keeps an open "Release PR" containing the
# version bump and CHANGELOG entry. Nothing publishes while that PR sits open.
#
# Merging the Release PR is the release: release-please tags it, cuts a GitHub
# Release, and the publish job below pushes it to npm.
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret. The trusted
# publisher is configured on npmjs.com against this repo + workflow filename,
# so renaming this file breaks publishing until it's updated there too.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tag + create the GitHub Release
  pull-requests: write # open/update the Release PR
  id-token: write # OIDC token for both npm and the MCP registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

      # Everything below runs only on the push that MERGED a Release PR.
      # Ordinary commits to main stop here, having only refreshed the PR.
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created == 'true' }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # release builds should never use a cache

      # Trusted publishing needs npm >= 11.5.1; pin forward rather than trust
      # whatever the runner image happens to ship.
      - run: npm install -g npm@latest
        if: ${{ steps.release.outputs.release_created == 'true' }}

      - run: npm ci
        if: ${{ steps.release.outputs.release_created == 'true' }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created == 'true' }}

      # `npm test` needs live Plan to Eat credentials, so the release gate is
      # the offline docs/registry drift check instead.
      - run: npm run check:docs
        if: ${{ steps.release.outputs.release_created == 'true' }}

      - run: npm publish
        if: ${{ steps.release.outputs.release_created == 'true' }}

      # The npm package must exist before the registry entry that points at it.
      - name: Install mcp-publisher
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # Authenticates via the same OIDC token npm used. The io.github.alex-zwingli
      # namespace is granted because this repo is owned by that GitHub account,
      # so there is no registry secret to manage.
      - name: Authenticate to the MCP registry
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: ./mcp-publisher login github-oidc

      # npm accepts a publish before the version is queryable ("your package is
      # being processed"), and the MCP registry rejects a server.json whose npm
      # version it cannot yet see. Wait for npm to actually serve it.
      - name: Wait for npm to serve the new version
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/plan-to-eat-mcp/$VERSION"; then
              echo "npm is serving $VERSION (after $((i * 15))s)"
              exit 0
            fi
            echo "not visible yet; retry $i/40"
            sleep 15
          done
          echo "::error::npm never served $VERSION; the registry entry would be rejected."
          exit 1

      # server.json's version is bumped by release-please via extra-files, so it
      # already matches the version published above -- nothing to patch here.
      - name: Publish to the MCP registry
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          for i in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "attempt $i failed; retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Summary
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          echo "Published \`plan-to-eat-mcp@${{ steps.release.outputs.version }}\` to npm and the MCP registry" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: ${{ steps.release.outputs.html_url }}" >> "$GITHUB_STEP_SUMMARY"
