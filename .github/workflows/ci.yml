# Build + checks for pull requests, including release-please's Release PR.
# Publishing lives in release.yml; this workflow never touches the registry.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Lower bound is package.json's engines field; upper is what release.yml
        # publishes with.
        node-version: ['18', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # `npm test` needs live Plan to Eat credentials, so CI runs the offline
      # docs/registry drift check instead.
      - run: npm run check:docs
